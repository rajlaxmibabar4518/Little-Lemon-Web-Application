{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Little Lemon{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'restaurant/css/style.css' %}">
</head>
<body>
  <header>
    <h1>🍋 Little Lemon</h1>
    <nav>
      <a href="{% url 'home' %}">Home</a>
      <a href="{% url 'about' %}">About</a>
      <a href="{% url 'menu' %}">Menu</a>
      <a href="{% url 'book' %}">Book a Table</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer><p>&copy; Little Lemon Restaurant, Chicago</p></footer>
</body>
</html>
